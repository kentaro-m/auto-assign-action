name: 'Release'

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.1.0)'
        required: true
      branch:
        description: 'Target branch'
        required: true
        default: 'master'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ./.node-version

      - name: Install dependencies
        run: npm install

      - name: Update version
        run: npm version ${{ inputs.version }} --no-git-tag-version

      - name: Build
        run: npm run build

      - name: Package
        run: npm run package

      - name: Commit to release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b release/v${{ inputs.version }}
          git add package.json package-lock.json dist/
          git commit -m "chore: release v${{ inputs.version }}"
          git push origin release/v${{ inputs.version }}

      - name: Open release pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_URL=$(gh pr create \
            --title "chore: release v${{ inputs.version }}" \
            --body "Automated release PR for v${{ inputs.version }}. Tagging and the GitHub Release are created automatically once this is merged." \
            --base "${{ inputs.branch }}" \
            --head "release/v${{ inputs.version }}")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --auto --merge "${{ steps.pr.outputs.pr_url }}"
